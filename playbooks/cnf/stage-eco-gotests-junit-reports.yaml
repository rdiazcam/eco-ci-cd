---
# Playbook Name: Stage eco-gotests CNF Network JUnit reports
# Description  : Copies per-suite JUnit XML files generated by eco-gotests
#                to a staging directory on the bastion so the reporter can
#                read them directly via remote_src=true, avoiding the 1 MiB
#                Kubernetes secret size limit of SHARED_DIR.
#
# Usage:
#   ansible-playbook ./playbooks/cnf/stage-eco-gotests-junit-reports.yaml \
#     -i ./inventories/cnf/switch-config.yaml \
#     --extra-vars "src_dir=/tmp/eco_gotests/report \
#                   dst_dir=/tmp/test_reports/junit"

- name: Stage eco-gotests reports on bastion
  hosts: bastion
  gather_facts: false
  vars:
    src_dir: /tmp/eco_gotests/report
    dst_dir_polarion: /tmp/test_reports/polarion
    dst_dir_polarion_only: /tmp/test_reports/polarion_only
    dst_dir_junit: /tmp/test_reports/junit
  tasks:
    - name: Remove existing staging root to ensure clean state
      ansible.builtin.file:
        path: /tmp/test_reports
        state: absent

    - name: Create staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dst_dir_polarion }}"
        - "{{ dst_dir_polarion_only }}"
        - "{{ dst_dir_junit }}"

    - name: Stage eco-gotests Polarion report (Polarion-only, not RP)
      ansible.builtin.copy:
        src: "{{ src_dir }}/report_testrun.xml"
        dest: "{{ dst_dir_polarion_only }}/"
        remote_src: true

    - name: Stage per-suite JUnit XML files from eco-gotests bastion output
      ansible.builtin.shell: |
        find "{{ src_dir }}" -maxdepth 1 -name "*_junit.xml" \
          -exec cp {} "{{ dst_dir_junit }}/" \;
      changed_when: true

    - name: Copy SHARED_DIR Polarion report to staging (for consolidated RP launch)
      ansible.builtin.copy:
        src: "{{ shared_dir }}/report_polarion.xml"
        dest: "{{ dst_dir_polarion }}/"
      when: (shared_dir | default('')) | length > 0

    - name: Copy SHARED_DIR JUnit reports to staging (for consolidated RP launch)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ dst_dir_junit }}/{{ item | basename | regex_replace('^junit_', '') }}"
      with_fileglob:
        - "{{ shared_dir | default('') }}/junit_*.xml"
      when: (shared_dir | default('')) | length > 0
